<style>

os-simple .s-product:hover{border-color:#a9c6ff;background:#fbfcff}#pos-simple .s-picture{background:#f4ede4;border-radius:10px;display:grid;place-items:center;height:96px;font-size:40px;margin-bottom:10px}#pos-simple .s-product:nth-child(3n+1) .s-picture{background:#ecf1f8}#pos-simple .s-product strong{display:block;font-size:12px;min-height:34px;line-height:1.3}#pos-simple .s-price{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-weight:600;font-size:14px}#pos-simple .s-plus{background:var(--s-soft);color:var(--s-blue);width:27px;height:27px;border-radius:8px;display:grid;place-items:center;font-size:19px}#pos-simple .s-cart{background:#fff;border:1px solid var(--s-line);border-radius:16px;padding:18px;min-height:365px;display:flex;flex-direction:column}#pos-simple .s-cart-heading{padding-bottom:17px;border-bottom:1px solid var(--s-line);display:flex;align-items:center;gap:8px}#pos-simple .s-count{margin-left:auto;border-radius:7px;background:var(--s-soft);color:var(--s-blue);font-size:11px;padding:3px 7px}#pos-simple .s-lines{flex:1}#pos-simple .s-row{display:flex;justify-content:space-between;align-items:center;gap:9px;padding:15px 0;border-bottom:1px solid var(--s-line);font-size:12px}#pos-simple .s-row strong{font-size:12px;white-space:nowrap}#pos-simple .s-row small{color:var(--s-muted);display:block;margin-top:4px;font-size:11px}#pos-simple .s-total{display:flex;align-items:center;justify-content:space-between;padding:20px 0 17px;font-size:13px}#pos-simple .s-total strong{font-size:25px;letter-spacing:-.7px}#pos-simple .s-primary{background:var(--s-blue);color:white;padding:13px 15px;border-radius:11px;font-weight:600;width:100%;font-size:14px}#pos-simple .s-quiet{background:none;color:var(--s-muted);font-size:11px;padding:11px 0 0}#pos-simple .s-help{font-size:11px;color:var(--s-muted);margin:13px 0 0}#pos-simple .s-success{text-align:center;display:flex;flex-direction:column;justify-content:center;flex:1;padding:13px 0;gap:12px}#pos-simple .s-tick{margin:0 auto;width:52px;height:52px;border-radius:50%;background:#e8f7ee;color:#21824f;display:grid;place-items:center;font-size:29px}#pos-simple .s-success .s-amount{font-size:29px;font-weight:700;letter-spacing:-.7px}#pos-simple .s-stock{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px;background:#fff;border-radius:13px;border:1px solid var(--s-line)}#pos-simple .s-stock-list{display:grid;gap:10px}#pos-simple .s-stock-pic{font-size:25px;background:#f5f0e8;border-radius:10px;padding:8px;width:47px;text-align:center}#pos-simple .s-stock-name{flex:1;font-size:13px;font-weight:600}#pos-simple .s-stock-name small{display:block;color:var(--s-muted);font-size:11px;font-weight:400;margin-top:3px}#pos-simple .s-stock-qty{font-size:12px;color:#336548;background:#edf7f0;padding:5px 9px;border-radius:7px}#pos-simple .s-summary{display:grid;grid-template-columns:1fr 1fr;gap:15px}#pos-simple .s-metric{background:#fff;border:1px solid var(--s-line);border-radius:15px;padding:23px}#pos-simple .s-metric strong{display:block;font-size:33px;letter-spacing:-1px;margin-top:12px}#pos-simple .s-note{margin-top:18px;background:var(--s-soft);border-radius:12px;padding:16px;color:#466389;font-size:12px}#pos-simple .s-footer{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--s-muted);padding:13px 5px}#pos-simple svg{flex-shrink:0}@media(max-width:900px){#pos-simple .s-products{grid-template-columns:repeat(2,minmax(0,1fr))}#pos-simple .s-picture{height:75px;font-size:33px}#pos-simple .s-main{padding:18px}#pos-simple .s-sale{gap:13px;grid-template-columns:minmax(0,1fr) 215px}}@media(max-width:650px){#pos-simple .s-layout{grid-template-columns:1fr}#pos-simple .s-nav{flex-direction:row;border-right:0;border-bottom:1px solid var(--s-line);padding:10px;gap:5px}#pos-simple .s-nav button{flex:1;justify-content:center;font-size:12px;padding:11px 7px}#pos-simple .s-sale{grid-template-columns:1fr}#pos-simple .s-products{grid-template-columns:repeat(3,minmax(0,1fr))}#pos-simple .s-picture{height:75px}#pos-simple .s-product strong{font-size:11px}#pos-simple .s-cart{min-height:0}#pos-simple .s-top small{display:none}#pos-simple .s-summary{grid-template-columns:1fr}}@media(max-width:390px){#pos-simple .s-products{grid-template-columns:repeat(2,minmax(0,1fr))}#pos-simple .s-main{padding:14px}#pos-simple .s-nav button{font-size:11px;gap:6px}}
</style>

<style>
#pos-simple .s-bar{display:block;height:10px;width:72%;max-width:100%;background:#d7dbe2;border-radius:4px;margin:7px 0}#pos-simple .s-bar.short{width:44%;height:8px;background:#e3e6eb}#pos-simple .s-bar.heading{height:17px;width:155px;margin:0 0 12px}#pos-simple .s-picture{background:linear-gradient(135deg,#e2e5ea,#d3d8df)!important;height:98px}#pos-simple .s-top{min-height:72px}#pos-simple .s-brand-placeholder{width:125px;height:15px;background:#d2d8e1;border-radius:5px}#pos-simple .s-user-placeholder{width:80px;height:10px;background:#e0e4ea;border-radius:4px}#pos-simple .s-nav{gap:9px}#pos-simple .s-nav button{min-height:43px}#pos-simple .s-head{margin-bottom:23px}#pos-simple .s-product{padding:11px}#pos-simple .s-product .s-bar{margin:9px 0}#pos-simple .s-cart{min-height:380px}#pos-simple .s-row .s-copy{flex:1;min-width:0}#pos-simple .s-row .s-copy .s-bar{width:85%}#pos-simple .s-row .s-copy .s-bar.short{width:55%}#pos-simple .s-row .s-thumb{width:35px;height:38px;background:#e0e4e9;border-radius:7px;flex-shrink:0}#pos-simple .s-row{padding:15px 0}#pos-simple .s-stock-pic{height:46px;background:#dce1e8}#pos-simple .s-stock-name .s-bar{width:120px}#pos-simple .s-list{display:grid;gap:12px}#pos-simple .s-order{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:#fff;border:1px solid var(--s-line);padding:19px;border-radius:14px;text-align:left;color:var(--s-ink)}#pos-simple .s-order .s-copy{flex:1;min-width:90px}#pos-simple .s-order .s-copy .s-bar{width:130px}#pos-simple .s-order-label{font-size:12px;min-width:74px}#pos-simple .s-badge{font-size:11px;padding:6px 9px;border-radius:7px;color:#37619b;background:var(--s-soft)}#pos-simple .s-badge.paid{background:#e8f5ed;color:#30714b}#pos-simple .s-ticket-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,300px);gap:22px;align-items:start}#pos-simple .s-ticket{background:#fff;padding:26px;border:1px solid var(--s-line);border-radius:4px;box-shadow:0 9px 20px #243c4b09}#pos-simple .s-ticket .s-bar{margin:12px auto}#pos-simple .s-ticket h3{text-align:center;margin-bottom:15px}#pos-simple .s-ticket hr{border:0;border-top:1px dashed #d6dce5;margin:22px 0}#pos-simple .s-ticket .s-row{border:0;padding:8px 0}#pos-simple .s-ticket .s-row .s-bar{margin:5px 0}#pos-simple .s-ticket-button{width:100%;border-radius:12px;background:#fff;border:1px solid var(--s-line);padding:18px;text-align:left;color:var(--s-ink);display:flex;justify-content:space-between;gap:10px}#pos-simple .s-ticket-button[aria-pressed=true]{border-color:#90b4fd;background:var(--s-soft)}#pos-simple .s-chart-placeholder{margin-top:22px;padding:25px;background:#fff;border:1px solid var(--s-line);border-radius:15px}#pos-simple .s-chart-bars{height:130px;display:flex;gap:18px;align-items:end;margin-top:23px}#pos-simple .s-chart-bars span{flex:1;background:#dce7fd;border-radius:7px 7px 0 0}#pos-simple .s-chart-bars span:nth-child(3){background:var(--s-blue)}#pos-simple .s-metric strong{font-size:30px}#pos-simple .s-main{min-height:450px}#pos-simple .s-status{color:#29714c;background:#e9f6ee;border-radius:12px;padding:20px;text-align:center;font-size:16px;margin-bottom:20px}#pos-simple .s-empty{padding:20px;color:var(--s-muted);font-size:12px}#pos-simple button:disabled{opacity:.4}#pos-simple .s-footer{justify-content:flex-end}@media(max-width:650px){#pos-simple .s-nav{flex-wrap:wrap}#pos-simple .s-nav button{flex:1 1 25%;min-height:41px}#pos-simple .s-ticket-layout{grid-template-columns:1fr}#pos-simple .s-cart{min-height:0}#pos-simple .s-ticket{max-width:350px;width:100%;justify-self:center}}
</style>
<div class="s-window"><header class="s-top" aria-label="Encabezado del negocio"><span class="s-brand-placeholder" aria-hidden="true"></span><span class="s-user-placeholder" aria-hidden="true"></span></header><div class="s-layout"><nav class="s-nav" aria-label="Navegación principal"></nav><main class="s-main"></main></div></div><div class="s-footer">Boceto interactivo</div>
<style>
#pos-simple{width:100%;min-width:0}
#pos-simple .s-window{width:100%}
#pos-simple .s-layout{height:600px;min-height:0}
#pos-simple .s-main{height:100%;min-height:0;min-width:0;padding:24px;overflow-y:auto;overflow-x:hidden;scrollbar-gutter:stable}
#pos-simple .s-nav{min-height:0}
#pos-simple .s-head{margin:0 0 23px}
@media(max-width:650px){
  #pos-simple .s-layout{height:760px;grid-template-rows:auto minmax(0,1fr)}
  #pos-simple .s-main{padding:16px}
}
</style>
<script>
(()=>{const root=document.getElementById('pos-simple'),main=root.querySelector('main'),nav=root.querySelector('nav');const prices=[35,60,25,48,32,20];let state={version:3,view:'ventas',cart:{0:1,1:1,2:1},paid:false,last:120,selected:101,tickets:[{id:101,total:95,items:{0:1,1:1}},{id:102,total:68,items:{3:1,5:1}}],orders:[{id:103,total:120,items:{0:1,1:1,2:1},status:'Pendiente'},{id:104,total:80,items:{1:1,5:1},status:'Pendiente'}]};const design={accent:'#1764f4'};const cash=n=>'$'+n.toFixed(2);const bar=(type='')=>`<span class="s-bar ${type}" aria-hidden="true"></span>`;const total=()=>Object.entries(state.cart).reduce((n,[i,q])=>n+prices[i]*q,0);const count=()=>Object.values(state.cart).reduce((a,b)=>a+b,0);const head=t=>`<div class="s-head"><h2>${t}</h2>${bar('short')}</div>`;const lines=items=>Object.entries(items).map(([i,n])=>`<div class="s-row" aria-label="Producto ${+i+1}, ${n} unidades, ${cash(n*prices[i])}"><span class="s-thumb" aria-hidden="true"></span><span class="s-copy">${bar()}${bar('short')}</span><strong>${cash(n*prices[i])}</strong></div>`).join('');function save(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{vista:state.view,tickets:state.tickets.length},privateContent:state}).catch(()=>{})}function restore(v){if(v?.version===3&&['ventas','productos','pedidos','tickets','resumen'].includes(v.view)&&Array.isArray(v.tickets)&&Array.isArray(v.orders))state=v}function render(){root.style.setProperty('--s-blue',design.accent);nav.innerHTML=[['ventas','Vender'],['productos','Productos'],['pedidos','Pedidos'],['tickets','Tickets'],['resumen','Resumen']].map(([id,label])=>`<button type="button" class="cursor-interaction" data-view="${id}" aria-label="${label}" ${state.view===id?'aria-current="page"':''}>${id==='resumen'?'<i data-lucide="chart-noaxes-combined" aria-hidden="true"></i>':label}</button>`).join('');if(state.view==='ventas'){main.innerHTML=`${head('Vender')}<div class="s-sale"><section aria-label="Productos"><div class="s-products">${prices.map((p,i)=>`<button class="s-product cursor-interaction" data-add="${i}" aria-label="Agregar producto ${i+1}, ${cash(p)}"><div class="s-picture" aria-hidden="true"></div>${bar()}${bar('short')}<span class="s-price">${cash(p)}<span class="s-plus">+</span></span></button>`).join('')}</div></section><section class="s-cart" aria-label="Pedido actual" aria-live="polite">${state.paid?`<div class="s-success"><div class="s-status">Cobrado</div><span class="s-amount">${cash(state.last)}</span>${bar()}<button class="s-primary cursor-interaction" data-view="tickets">Ver ticket</button><button class="s-quiet cursor-interaction" data-new="1">Nueva venta</button></div>`:`<div class="s-cart-heading"><h3>Pedido</h3><span class="s-count">${count()}</span></div><div class="s-lines">${lines(state.cart)}</div><div class="s-total"><span>Total</span><strong>${cash(total())}</strong></div><button class="s-primary cursor-interaction" data-pay="1">Cobrar ${cash(total())}</button>`}</section></div>`}else if(state.view==='productos'){main.innerHTML=head('Productos')+`<div class="s-stock-list">${prices.map((p,i)=>`<div class="s-stock" aria-label="Producto ${i+1}"><span class="s-stock-pic" aria-hidden="true"></span><span class="s-stock-name">${bar()}${bar('short')}</span><strong>${cash(p)}</strong></div>`).join('')}</div>`}else if(state.view==='pedidos'){main.innerHTML=head('Pedidos')+`<div class="s-list">${state.orders.map(o=>`<button class="s-order cursor-interaction" data-order="${o.id}" aria-label="${o.status==='Pendiente'?'Abrir':'Ver'} pedido ${o.id}"><strong class="s-order-label">#${o.id}</strong><span class="s-copy">${bar()}${bar('short')}</span><span class="s-badge ${o.status==='Pagado'?'paid':''}">${o.status}</span><strong>${cash(o.total)}</strong></button>`).join('')}</div>`}else if(state.view==='tickets'){const t=state.tickets.find(t=>t.id===state.selected)||state.tickets[state.tickets.length-1];main.innerHTML=head('Tickets')+`<div class="s-ticket-layout"><div class="s-list">${state.tickets.slice().reverse().map(t=>`<button class="s-ticket-button cursor-interaction" data-ticket="${t.id}" aria-pressed="${state.selected===t.id}"><span>Ticket #${t.id}</span><strong>${cash(t.total)}</strong></button>`).join('')}</div><section class="s-ticket" aria-label="Vista previa del ticket ${t.id}"><h3>Ticket #${t.id}</h3>${bar()}${bar('short')}<hr>${Object.entries(t.items).map(([i,n])=>`<div class="s-row"><span class="s-copy">${bar()}${bar('short')}</span><strong>${cash(prices[i]*n)}</strong></div>`).join('')}<hr><div class="s-total"><span>Total</span><strong>${cash(t.total)}</strong></div>${bar('short')}</section></div>`}else{main.innerHTML=head('Resumen')+`<div class="s-summary"><div class="s-metric"><span>Total vendido</span><strong>${cash(state.tickets.reduce((a,t)=>a+t.total,0))}</strong>${bar('short')}</div><div class="s-metric"><span>Tickets</span><strong>${state.tickets.length}</strong>${bar('short')}</div></div><div class="s-chart-placeholder" aria-label="Espacio de referencia para una gráfica">${bar()}${bar('short')}<div class="s-chart-bars" aria-hidden="true">${[35,62,92,55,75,48].map(n=>`<span style="height:${n}%"></span>`).join('')}</div></div>`}if(window.lucide)lucide.createIcons({attrs:{width:20,height:20}})}root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.view)state.view=d.view;if(d.add!==undefined){if(state.paid){state.cart={};state.paid=false}state.cart[d.add]=(state.cart[d.add]||0)+1}if(d.pay&&count()){state.last=total();const id=state.activeOrder||Math.max(104,...state.tickets.map(t=>t.id),...state.orders.map(o=>o.id))+1;state.tickets.push({id,total:state.last,items:{...state.cart}});let o=state.orders.find(o=>o.id===id);if(o){o.status='Pagado';o.total=state.last;o.items={...state.cart}}else state.orders.push({id,total:state.last,items:{...state.cart},status:'Pagado'});state.selected=id;state.paid=true;state.activeOrder=null}if(d.new){state.cart={0:1,1:1,2:1};state.paid=false;state.activeOrder=null}if(d.order){let o=state.orders.find(o=>o.id===+d.order);if(o.status==='Pagado'){state.selected=o.id;state.view='tickets'}else{state.cart={...o.items};state.activeOrder=o.id;state.paid=false;state.view='ventas'}}if(d.ticket)state.selected=+d.ticket;render();save()});restore(window.openai?.widgetState?.privateContent);render();window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState?.privateContent){restore(e.detail.globals.widgetState.privateContent);render()}});if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addColorPicker(design,'accent',{label:'Color principal',reference:'--s-blue'})}})();
</script>
</div>
