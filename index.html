<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miguel Aranda</title>
<meta name="description" content="Estudiante de Fisioterapia. Cofundador y CEO de NoPain Technologies, actual desarrollador de NoPain.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>M</text></svg>">
<style>
  :root {
    --bg:#fbfaf8; --ink:#1a1a18; --muted:#6b6862; --rule:#e5e1da; --accent:#1a1a18;
    --serif: 'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif;
    --sans: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14140f; --ink:#eae7e0; --muted:#98948c; --rule:#2c2b26; --accent:#eae7e0; }
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans);
    font-size:17px; line-height:1.65; -webkit-font-smoothing:antialiased;
    display:flex; min-height:100vh; align-items:center;
  }
  main { width:100%; max-width:34rem; margin:0 auto; padding:4rem 1.5rem; }
  h1 {
    font-family:var(--serif); font-weight:400; font-size:clamp(2.6rem,9vw,3.6rem);
    line-height:1.05; letter-spacing:-.02em; margin:0 0 .6rem;
  }
  .role { color:var(--muted); font-size:1.02rem; line-height:1.5; margin:0 0 3rem; max-width:26rem; }
  p { margin:0 0 1.15rem; }
  .bio { margin-bottom:2.75rem; }
  nav { border-top:1px solid var(--rule); padding-top:1.5rem; }
  nav a {
    display:flex; justify-content:space-between; align-items:baseline; gap:1rem;
    padding:.6rem 0; color:var(--ink); text-decoration:none;
    border-bottom:1px solid var(--rule); transition:padding-left .18s ease, color .18s ease;
  }
  nav a:last-child { border-bottom:0; }
  nav a:hover, nav a:focus-visible { padding-left:.5rem; }
  nav a .where { color:var(--muted); font-size:.9rem; }
  nav a:hover .where { color:var(--ink); }
  footer { margin-top:3rem; color:var(--muted); font-size:.85rem; }
  ::selection { background:var(--ink); color:var(--bg); }
</style>
</head>
<body>
<main>
  <h1>Miguel Aranda</h1>
  <p class="role">Estudiante de Fisioterapia &middot; Cofundador y CEO de NoPain Technologies, actual desarrollador de NoPain</p>

  <nav>
    <a href="mailto:miguel@miguelaranda.org">Correo <span class="where">miguel@miguelaranda.org</span></a>
    <a href="https://github.com/marandaguilar" rel="me">GitHub <span class="where">marandaguilar</span></a>
    <!-- TODO: añade o quita los que quieras (LinkedIn, X, etc.) -->
  </nav>

  <footer>Aguascalientes, México</footer>
</main>
</body>
</html>
